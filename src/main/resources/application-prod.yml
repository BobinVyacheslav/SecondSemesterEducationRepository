server:
  port: 80
  server-header: "Task-Manager-Server"
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: WARN
    com.mipt.todolist: INFO
  file:
    name: logs/task-manager-prod.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true