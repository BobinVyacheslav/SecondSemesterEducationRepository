spring:
  application:
    name: MIPT-TaskManager-API
  profiles:
    default: dev
  main:
    allow-bean-definition-overriding: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

app:
  version: 2.0.0
  description: MVP Task Manager for MIPT Spring Course
  tasks:
    default-status: PENDING
  attachments:
    upload-dir: uploads

security:
  pepper: ${SECURITY_PEPPER:study-pepper-2026}

jwt:
  secret: ${JWT_SECRET:study-jwt-secret-key-for-homework-4-change-me-please-2026}
  expiration: 10m

external:
  api:
    base-url: ${EXTERNAL_API_BASE_URL:http://localhost:8080/external/v1}
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      externalApi:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  ratelimiter:
    instances:
      externalApi:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0s

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always

logging:
  level:
    root: INFO
    com.mipt.todolist: DEBUG
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: beans,health,info,env,metrics

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:todolist;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

server:
  port: 80
  server-header: Task-Manager-Server
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: WARN
    com.mipt.todolist: INFO
  file:
    name: logs/task-manager-prod.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB

management:
  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      enabled: true
      show-details: never
    metrics:
      enabled: true
