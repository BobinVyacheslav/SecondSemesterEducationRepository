spring:
  application:
    name: "MIPT-TaskManager-API"
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  version: "2.0.0"
  description: "MVP Task Manager for MIPT Spring Course"
  tasks:
    default-status: "PENDING"
  attachments:
    upload-dir: "uploads"

spring.jackson:
  serialization:
    indent_output: true
    write_dates_as_timestamps: false
